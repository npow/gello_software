robot:
  _target_: gello.robots.yam.YAMRobot
  channel: can_left

agent:
  _target_: gello.agents.as5600_agent.PotentiometerSerialAgent
  # Replace this with the stable path from: ls /dev/serial/by-id/
  port: /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
  baudrate: 115200
  channel_map: [0, 1, 2, 3, 4, 5, 6]
  # Flip an entry after the simulation direction check if that axis is reversed.
  joint_signs: [1, 1, 1, 1, 1, 1, 1]
  # J1 maps the leader's protected 280-degree sweep onto YAM's 325 degrees.
  joint_scales: [1.160714286, 1, 1, 1, 1, 1, 1]
  # Assemble at the printed zero stops and calibrate at this mid-range pose.
  start_joints: [0.218166, 1.832596, 1.832596, 0, 0, 0, 1]
  joint_limits:
    - [-2.617994, 3.054326]
    - [0, 3.665191]
    - [0, 3.665191]
    - [-1.570796, 1.570796]
    - [-1.570796, 1.570796]
    - [-2.094395, 2.094395]
    - [0, 1]
  gripper_joint_index: 6
  gripper_travel_rad: 0.785398
  gripper_open_value: 1
  gripper_closed_value: 0
  startup_timeout_s: 5
  frame_timeout_s: 0.25
  require_deadman: true
  max_output_rates: [1.0, 1.0, 1.0, 1.0, 1.5, 1.5, 2]

hz: 30
